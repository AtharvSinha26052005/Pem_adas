services:
  db:
    image: postgres:16-alpine
    container_name: adas_postgres
    environment:
      POSTGRES_DB: adas_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - adas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d adas_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adas_backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:root@db:5432/adas_platform
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  adas_pgdata:
